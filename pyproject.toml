[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dandan-creative-studio"
version = "0.1.0"
description = "蛋蛋的独立创作工作室：统一的内容计划、渲染与质检；发布由上游插件负责。"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=10.0.0",
  "tzdata>=2024.1",
]

[project.scripts]
dandan-studio = "studio.cli:main"

[tool.setuptools.packages.find]
include = ["studio*"]

[tool.pytest.ini_options]
pythonpath = ["."]
